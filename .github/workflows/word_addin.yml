name: Word Add-in
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  word-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: word-addin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: word-addin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package:test
      - name: Verify test-web deployment staging
        working-directory: .
        run: |
          node --test frontend/lex-intel/scripts/deploy-with-word.test.mjs frontend/lex-intel/scripts/stage-word-addin.test.mjs word-addin/scripts/verify-deployment.test.mjs word-addin/scripts/framing-policy.test.mjs word-addin/scripts/configure-framing.test.mjs word-addin/scripts/install-manifest.test.mjs
          node frontend/lex-intel/scripts/stage-word-addin.mjs test
          cmp word-addin/release/test/word-addin/taskpane.html frontend/lex-intel/build/word-addin/taskpane.html
      - run: npm run validate
      - name: Build and validate Marketplace preparation packet
        run: |
          npm run package:marketplace
          node node_modules/office-addin-manifest/cli.js validate manifests/prod.xml
      - name: Verify production deployment staging
        working-directory: .
        run: |
          node frontend/lex-intel/scripts/stage-word-addin.mjs prod
          cmp word-addin/release/prod/word-addin/manifest.xml frontend/lex-intel/build/word-addin/manifest.xml
          cmp word-addin/release/prod/word-addin/config.js frontend/lex-intel/build/word-addin/config.js
      - uses: actions/upload-artifact@v7
        with:
          name: lextext-word-marketplace-draft
          path: word-addin/release/lextext-word-marketplace-draft.zip
      - run: npm exec playwright -- install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: lextext-word-test-installer
          path: word-addin/release/lextext-word-test.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: word-browser-results
          path: word-addin/test-results
          if-no-files-found: ignore
  word-api:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: word-addin/requirements-test.txt
      - run: pip install -r word-addin/requirements-test.txt
      - run: python -m pytest -p tests.offline_guard tests/test_word_addin.py tests/test_word_document_workflow.py tests/test_word_refinement.py tests/test_word_research.py tests/test_word_model.py tests/test_word_citations.py -q
        env:
          WORD_TEST_REDIS_URL: redis://localhost:6379/15
