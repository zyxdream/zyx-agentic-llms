name: Live Semantic Evaluation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-semantic-evaluation
  cancel-in-progress: false

jobs:
  live-semantic-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEXINTEL_E2E: '1'
      E2E_REDIS_URL: redis://localhost:6379/15
      E2E_DATABASE_URL: sqlite:///${{ runner.temp }}/lexintel-e2e-${{ github.run_id }}.db
      E2E_CELERY_QUEUE: lexintel-e2e-live-${{ github.run_id }}
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/live-semantic
      PYTHONUNBUFFERED: '1'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade "pip<24.1"
          pip install -r requirements.txt

      - name: Start isolated Celery worker
        run: |
          mkdir -p "$E2E_ARTIFACT_DIR"
          python -m backend.e2e_worker \
            --pool=solo \
            --loglevel=INFO \
            --include tests.e2e.celery_probe \
            > "$E2E_ARTIFACT_DIR/celery.log" 2>&1 &
          worker_pid=$!
          echo "$worker_pid" > "$E2E_ARTIFACT_DIR/celery-worker.pid"

          # backend.app creates the SQLite schema during worker startup. Wait
          # for that initialization to finish before the evaluator imports the
          # same app and checks the schema, otherwise create_all() can race.
          worker_ready=false
          for attempt in {1..30}; do
            if grep -Eq 'celery@.* ready\.' "$E2E_ARTIFACT_DIR/celery.log"; then
              worker_ready=true
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              echo "Celery worker exited during startup"
              cat "$E2E_ARTIFACT_DIR/celery.log"
              exit 1
            fi
            sleep 1
          done

          if [ "$worker_ready" != true ]; then
            echo "Celery worker did not become ready within 30 seconds"
            cat "$E2E_ARTIFACT_DIR/celery.log"
            exit 1
          fi

      - name: Run real-LLM semantic evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m tests.e2e.run_live_semantic_evaluation

      - name: Stop isolated Celery worker
        if: ${{ always() }}
        run: |
          if [ -f "$E2E_ARTIFACT_DIR/celery-worker.pid" ]; then
            kill "$(cat "$E2E_ARTIFACT_DIR/celery-worker.pid")" 2>/dev/null || true
            wait "$(cat "$E2E_ARTIFACT_DIR/celery-worker.pid")" 2>/dev/null || true
          fi

      - name: Upload live evaluation artifacts on failure
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-semantic-evaluation-${{ github.run_id }}
          path: artifacts/live-semantic
          if-no-files-found: warn
          retention-days: 14
